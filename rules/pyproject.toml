# SPDX-License-Identifier: Apache-2.0
[project]
name = "ws180g-rules"
version = "0.0.0"
description = "ws180g pipeline component: rules"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["pydantic>=2.11", "klayout>=0.30.12", "ws180g-process", "ws180g-layergen"]

[project.scripts]
ws180g-rule-table = "ws180g_rules.table:main"
ws180g-klayout-deck = "ws180g_rules.klayout_deck:main"
ws180g-fixtures = "ws180g_rules.fixtures:main"
ws180g-manual = "ws180g_rules.manual:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ws180g_rules"]
