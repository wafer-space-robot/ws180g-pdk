# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run pytest -rs -v -m "not sandbox"
      - run: uv run ws180g-build --no-container
      - run: uv run ws180g-check-names
      - run: uv run ws180g-check-private
      - run: uv run sphinx-build -W docs out/docs

  sandbox:
    # Manual only: the base image is about 15 GB. If the hosted runner cannot hold it, the
    # failure is recorded in the Task 23 report and the sandbox tests stay host-run.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # docker/build dates the image from the history of its inputs
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages
      - name: Build the image (docker/build pulls the pinned base itself)
        run: docker/build
      - run: uv run pytest -rs -v -m "sandbox and not slow"
