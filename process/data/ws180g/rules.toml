# SPDX-License-Identifier: Apache-2.0
# The Phase 0 rule set of ws180g005 (plan, shared vocabulary). Lengths in um, areas in
# um2. Each value is the public envelope with a margin (spec 3.6): at least 1.2 x the
# largest binding public minimum, rounded up to the 0.005 um grid (area: up to a
# multiple of 0.005 um2); 1.5 x when every binding entry cited comes from one source
# (this plan's provisional single-source rule); a maximum is the smallest public maximum
# divided by 1.25, or by 1.5 for a single source, rounded down. Cut sizes are exact
# (spec 3.3). `margin_achieved` = value / largest binding cited minimum (smallest
# maximum / value), rounded half-up to 0.001; guideline entries are cited but never
# bind. `layers` are layer expressions over the layer names and the aliases below.

[aliases]
df = "nd|pd"
field_po = "po-(df.sized(rules.po.x.df))"

