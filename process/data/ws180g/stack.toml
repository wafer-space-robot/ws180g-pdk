# The process stack. Fields absent here (a thickness, a doping, a registration value) are
# unknown, not zero. A range field covers the cited public values with a margin (spec 3.2,
# 3.6): `min` = smallest cited value / margin rounded down, `max` = largest cited value x
# margin rounded up, to the unit's precision (nm 0.01, um the 0.005 grid, V 0.001,
# ohm/sq 0.0001); `margin_achieved_min` = smallest cited value / min and
# `margin_achieved_max` = max / largest cited value, rounded half-up to 0.001.

# The 5 V gate oxide, the only oxide of ws180g005. Its minimum gate lengths are the rules.
[stack.oxides.5v0]
lmin_n = "rules.po.l.n"
lmin_p = "rules.po.l.p"

[stack.oxides.5v0.thickness]
range = { min = 12.66, nominal = 15.6, max = 19.2, unit = "nm" }
unit = "nm"
provenance = "derived"
evidence = ["gf180mcu-models/nfet_06v0/toxe", "gf180mcu-models/nfet_06v0/toxp"]
margin = 1.2
margin_reason = "two card parameters (TOXE, TOXP) bound the range from both sides; single-source 1.5 would put the minimum below any published 5 V oxide"
margin_achieved_min = 1.201
margin_achieved_max = 1.200
note = "GF180MCU 6 V card: electrical TOXE 15.2 nm, physical TOXP 16.0 nm; min 15.2 / 1.2 = 12.667, down to 12.66; nominal the midpoint 15.6; max 16.0 x 1.2 = 19.2"

[stack.oxides.5v0.vt_n]
range = { min = 0.560, nominal = 0.722, max = 0.924, unit = "V" }
unit = "V"
provenance = "derived"
evidence = ["gf180mcu-models/nfet_06v0/vth0", "xc018/ne5/vt"]
margin = 1.2
margin_achieved_min = 1.202
margin_achieved_max = 1.200
note = "long-channel NMOS threshold: GF180MCU card vth0 0.67314 V, X-FAB XC018 ne5 0.77 V; min 0.67314 / 1.2 = 0.56095, down to 0.560; nominal the midpoint 0.72157, to 0.722; max 0.77 x 1.2 = 0.924"

[stack.oxides.5v0.vt_p]
range = { min = 0.700, nominal = 0.869, max = 1.078, unit = "V" }
unit = "V"
provenance = "derived"
evidence = ["gf180mcu-models/pfet_06v0/vth0", "xc018/pe5/vt"]
margin = 1.2
margin_achieved_min = 1.200
margin_achieved_max = 1.201
note = "magnitude of the long-channel PMOS threshold: GF180MCU card vth0 -0.8978 V (magnitude 0.8978), X-FAB XC018 pe5 0.84 V; min 0.84 / 1.2 = 0.700; nominal the midpoint 0.8689, to 0.869; max 0.8978 x 1.2 = 1.07736, up to 1.078"

